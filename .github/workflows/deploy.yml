name: Deploy to GitHub Pages

run-name: "Deploy to GitHub Pages by @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches: [main]

# One deploy at a time: a newer merge waits for the running deploy instead of
# racing it on the gh-pages branch (only the latest pending run is kept).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate GraphQL docs
        run: npm run doc
        env:
          GRAPHQL_MARKDOWN_TELEMETRY_DEBUG: "1"

      - name: Build
        run: npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
